name: DevOps Monitor Pro CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-and-test:
    name: 🐍 Backend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov flake8 black

      - name: Code Formatting Check (Black & Flake8)
        run: |
          flake8 backend/app --max-line-length=120

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest tests/ --cov=app -v

  frontend-build-and-test:
    name: ⚛️ Frontend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Check
        run: |
          cd frontend
          npm run lint

      - name: Run Unit Tests
        run: |
          cd frontend
          npm run test

      - name: Run Production Build Check
        run: |
          cd frontend
          npm run build

  docker-build-verification:
    name: 🐳 Docker Compose Stack Build
    needs: [backend-lint-and-test, frontend-build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Write CI-only .env
        run: |
          cat > .env << 'ENVEOF'
          SECRET_KEY=ci-only-throwaway-secret-key
          ADMIN_DEFAULT_PASSWORD=ci-only-admin-password
          POSTGRES_PASSWORD=ci-only-postgres-password
          GRAFANA_ADMIN_PASSWORD=ci-only-grafana-password
          ENVEOF

      - name: Build Docker Stack
        run: |
          docker compose build backend frontend

      - name: Test Container Startup & Healthcheck
        run: |
          docker compose up -d backend frontend
          sleep 12
          curl -f http://localhost:8000/health || exit 1
          curl -f http://localhost:80/ || exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v