server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # WebSocket route must come before the general /api location: it needs
    # the Upgrade/Connection headers below, which a plain HTTP proxy_pass
    # does not send. Without this block, the browser's WebSocket handshake
    # to /api/metrics/ws gets proxied as an ordinary HTTP request, Nginx
    # never upgrades the connection, and the socket fails to open - which
    # is exactly why the frontend used to bypass Nginx and hit the backend
    # container's port directly instead (see Dashboard.jsx history).
    location /api/metrics/ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Metrics stream is long-lived (the connection is meant to stay
        # open indefinitely); the default proxy read timeout would kill it
        # after 60s of the client just listening.
        proxy_read_timeout 3600s;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend's health endpoints live at the root (/health, /health/database,
    # /health/redis), not under /api - proxied here so an external
    # uptime-monitor/load-balancer can check backend health through the one
    # publicly exposed port, without needing direct access to the backend
    # container's own (unpublished, in production) port 8000.
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
