services:
  # -------------------------------------------------------------
  # SHP Backend Service (FastAPI + Uvicorn)
  # -------------------------------------------------------------
  - type: web
    name: shp-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_DEFAULT_PASSWORD
        value: admin123
      - key: DATABASE_URL
        fromDatabase:
          name: shp-postgres
          property: connectionString

  # -------------------------------------------------------------
  # SHP Frontend Static Site (React + Vite + TailwindCSS)
  # -------------------------------------------------------------
  - type: web
    name: shp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: shp-backend
          property: host

# ---------------------------------------------------------------
# Managed PostgreSQL Database
# ---------------------------------------------------------------
databases:
  - name: shp-postgres
    plan: free
    databaseName: shp_db
    user: shp_user
